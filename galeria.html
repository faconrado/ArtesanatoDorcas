<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Galeria - Artesanato Dorcas</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>

        <header class="menuHeader">
            <nav class="nav_site" aria-label="Menu Principal">
                <a href="index.html">Home</a>                
            </nav>
        </header>

        <section class="featureSwiper">

            <div class="swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="./img/2.webp" alt="Imagem 1"></div>
                    <div class="swiper-slide"><img src="./img/mesaFesta.webp" alt="Imagem 2"></div>
                    <div class="swiper-slide"><img src="img/WhatsApp Image 2026-03-09 at 22.53.40 (3).webp" alt="Imagem 3"></div>
                    
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-scrollbar"></div>
                </div>

            <section class="btAdicionar">

                <!-- Container do Swiper --> 
                <div class="swiper-wrapper" id="swiperWapper"></div>

                <!-- Botão visível na tela-->
                <button id="btnAdicionar">Adionar Imagem</button>

                <!-- input de arquivo oculto (accept="image/*" restringe apenas para imagem)-->
                <input type="file" id="inputArquivo" accept="image/*" style="display: none;">

            </section>

        </section>

        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <script src="./script.js"></script>




    </body>
</html>
