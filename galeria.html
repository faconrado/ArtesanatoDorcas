<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Galeria - Artesanato Dorcas</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
        <link rel="stylesheet" href="./styles.css">
        <link rel="stylesheet" href="./indexStyles.css">
        <link rel="stylesheet" href="./mobileStyles.css">


    </head>

<body>

    <section class="hero">

        <header class="menuHeader">
            <nav class="nav_site" aria-label="Menu Principal">
                <a href="index.html">Home</a>                
            </nav>
        </header>

        <section class="featureSwiper">

            <div class="swiper">
                <!-- Adicionado o ID correto aqui onde o Swiper gerencia os slides -->
                <div class="swiper-wrapper" id="swiperWrapper"></div><!-- Os slides serão adicionados dinamicamente aqui -->
                
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-scrollbar"></div>
            </div>

            <section class="btAdicionar">
                <!-- Botão visível na tela -->
                <button id="btnAdicionar">Adicionar Imagem</button>

                <!-- Input de arquivo oculto -->
                <input type="file" id="inputArquivo" accept="image/*" style="display: none;">
            </section>

        </section>

        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <!-- IMPORTANTE: Adicionado o type="module" para permitir o uso do Firebase -->
        <script type="module" src="./app.js"></script>

    </section>   
</body>
</html>
