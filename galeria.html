<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Galeria - Artesanato Dorcas</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
        <link rel="stylesheet" href="./styles.css">
        <link rel="stylesheet" href="./index-styles.css">
        <link rel="stylesheet" href="./mobile-styles.css">


    </head>

<body>

    <section class="hero">

        <header class="menuHeader">
            <nav class="nav_site" aria-label="Menu Principal">
                <a href="index.html">Home</a>                
            </nav>
        </header>

        <section class="featureSwiper">

            <section id="areaLogin" style="margin-top: 20px; text-align: center; display: none;">
                <h3 style="color: #fff;">Área do Administrador</h3>
                <input type="email" id="loginEmail" placeholder="E-mail" style="padding: 8px; margin: 5px; border-radius: 4px; border: none;">
                <input type="password" id="loginSenha" placeholder="Senha" style="padding: 8px; margin: 5px; border-radius: 4px; border: none;">
                <button id="btnLogar" style="padding: 8px 15px; background-color: #00f3ff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Entrar</button>
            </section>

            <footer style="text-align: center; margin-top: 40px; padding: 20px;">
                <button id="btnExibirLogin" style="background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 12px;">Acesso Restrito</button>
                <button id="btnDeslogar" style="display: none; background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Sair do Modo Admin</button>
            </footer>

            <div class="swiper">
                <!-- Adicionado o ID correto aqui onde o Swiper gerencia os slides -->
                <div class="swiper-wrapper" id="swiperWrapper"></div><!-- Os slides serão adicionados dinamicamente aqui -->
                
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-scrollbar"></div>
            </div>

            <section class="btAdicionar">
                <!-- Botão visível na tela -->
                <button id="btnAdicionar" style="display: none;">Adicionar Imagem</button>

                <!-- Input de arquivo oculto -->
                <input type="file" id="inputArquivo" accept="image/*" style="display: none;">
            </section>

        </section>

        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <!-- IMPORTANTE: Adicionado o type="module" para permitir o uso do Firebase -->
        <script type="module" src="./app.js"></script>

    </section>   
</body>
</html>
